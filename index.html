<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shaurya weds Diksha | Wedding Invitation</title>
  <meta name="description" content="Wedding celebration of Shaurya Kapoor & Diksha Bhatia on 01 & 02 December 2026 at Dayal Gateway, Lucknow. Tap to unroll the invitation.">
  <meta name="theme-color" content="#1A1D3F">

  <!-- Favicon & Apple Touch Icon -->
  <link rel="icon" href="./assets/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="./assets/logo.png">
  <meta property="og:image" content="./assets/logo.png">

  <!-- Google Fonts Preconnect & Stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Pinyon+Script:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Tiro+Devanagari+Hindi:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <!-- Core Theme & Layout Styles -->
  <link rel="stylesheet" href="./assets/engine.css">
  <link rel="stylesheet" href="./assets/layouts/keepsake.css">
  <link rel="stylesheet" href="./assets/layouts/decor-daynight.css">

  <script>
    if (/[?&]phone=1(&|$)/.test(location.search)) document.documentElement.classList.add("in-phone");
  </script>

  <!-- Wedding Configuration & Personal Details -->
  <script src="./config.js"></script>

  <!-- Interactive Layout & Animation Engines -->
  <script src="./assets/openings.js"></script>
  <script src="./assets/layouts/keepsake.js"></script>
  <script src="./assets/layouts/decor-daynight.js"></script>
</head>

<body class="sealed layout-keepsake" data-theme="rangeelo">
  <!-- Accessibility Skip -->
  <a class="skip" href="#invitation" id="skip">Skip the opening and read the invitation</a>

  <!-- Animated Backdrop -->
  <div class="backdrop" aria-hidden="true"></div>

  <!-- Opening Gate (The Unrolling Haveli Cloth Gesture) -->
  <div class="gate framed" id="gate" data-edge="">
    <div class="gate-fill" aria-hidden="true"></div>
    <div class="gate-mirror bottom" aria-hidden="true"></div>
    <div class="gate-mirror top" aria-hidden="true"></div>

    <p class="greet tone-light" id="greet" lang="en">
      You're invited<small>to a wedding celebration</small>
    </p>

    <div class="stage" id="stage"></div>

    <p class="hint tone-light" id="hint" aria-hidden="true" lang="en">
      Tap to unroll the invitation
    </p>
  </div>

  <!-- Main Scroll Container -->
  <main class="col" id="main">
    <p class="today" id="today" hidden=""></p>

    <!-- Hero Section -->
    <header class="hero custom" id="hero">
      <img class="hero-art" id="heroArt" alt="" decoding="async">
      <div class="hero-words" id="heroWords"></div>
      <div class="lay-hero" id="layHero"></div>
    </header>

    <a class="down" href="#paper" id="down" lang="en">
      <span>Scroll down</span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.3"></path>
      </svg>
    </a>

    <!-- The Paper Scroll (Content, Scratch Cards, Events, Countdown, RSVP) -->
    <div class="paper decor-daynight" id="paper"></div>
  </main>

  <!-- Floating Audio & Language Controls -->
  <div class="controls" id="controls" hidden="">
    <button class="lang" id="langBtn" type="button" aria-label="Switch language" lang="hi">हिं</button>
    <button class="sound" id="soundBtn" type="button" aria-pressed="false" aria-label="Play music">
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 5.5v13l10.5-6.5z" fill="currentColor"></path>
      </svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7.5 5.5h3v13h-3zM13.5 5.5h3v13h-3z" fill="currentColor"></path>
      </svg>
    </button>
  </div>

  <!-- Background Music Audio -->
  <audio id="music" preload="none" loop="" src="./assets/themes/theme.mp3"></audio>

  <!-- Engine Script -->
  <script src="./assets/engine.js"></script>
</body>
</html>
