<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72511a"/>
      <stop offset="25%" stop-color="#b8862b"/>
      <stop offset="50%" stop-color="#dfbb73"/>
      <stop offset="75%" stop-color="#b8862b"/>
      <stop offset="100%" stop-color="#72511a"/>
    </linearGradient>
    <linearGradient id="softGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dfbb73"/>
      <stop offset="100%" stop-color="#b8862b"/>
    </linearGradient>
  </defs>

  <!-- Outer ornamental circle -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="3, 5"/>
  <circle cx="200" cy="200" r="172" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="162" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>

  <!-- Scalloped beads -->
  <g fill="url(#goldGrad)">
    <circle cx="200" cy="30" r="4"/>
    <circle cx="200" cy="370" r="4"/>
    <circle cx="30" cy="200" r="4"/>
    <circle cx="370" cy="200" r="4"/>
    <circle cx="80" cy="80" r="3"/>
    <circle cx="320" cy="80" r="3"/>
    <circle cx="80" cy="320" r="3"/>
    <circle cx="320" cy="320" r="3"/>
  </g>

  <!-- Top Auspicious Motif (Lotus / Kalash Crown) -->
  <g fill="url(#goldGrad)" transform="translate(200, 85) scale(0.75)">
    <!-- Central lotus petal -->
    <path d="M0 -35 C12 -20 12 -5 0 10 C-12 -5 -12 -20 0 -35 Z"/>
    <!-- Side petals -->
    <path d="M-5 -25 C-22 -15 -25 5 -10 12 C-5 5 -2 -12 -5 -25 Z"/>
    <path d="M5 -25 C22 -15 25 5 10 12 C5 5 2 -12 5 -25 Z"/>
    <circle cx="0" cy="-42" r="3.5"/>
  </g>

  <!-- Rajasthani Arch Contour in Center -->
  <path d="M110 270 L110 210 Q110 160 155 140 Q200 120 200 132 Q200 120 245 140 Q290 160 290 210 L290 270" 
        fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Monogram Initials S & D (Shaurya & Diksha) -->
  <g text-anchor="middle" fill="url(#goldGrad)">
    <text x="168" y="222" font-family="'Cormorant Garamond', 'Playfair Display', serif" font-size="54" font-weight="600" font-style="italic" letter-spacing="1">S</text>
    <text x="200" y="218" font-family="'Pinyon Script', 'Allura', cursive" font-size="38" opacity="0.85">&amp;</text>
    <text x="234" y="222" font-family="'Cormorant Garamond', 'Playfair Display', serif" font-size="54" font-weight="600" font-style="italic" letter-spacing="1">D</text>
  </g>

  <!-- Divider Ribbon in Seal -->
  <path d="M135 240 Q200 248 265 240" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <circle cx="200" cy="244" r="2.5" fill="url(#goldGrad)"/>

  <!-- Couple Names & Date -->
  <text x="200" y="276" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="15" font-weight="600" letter-spacing="3" fill="url(#goldGrad)">
    SHAURYA &amp; DIKSHA
  </text>
  <text x="200" y="300" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="12" font-weight="500" letter-spacing="3" fill="url(#goldGrad)" opacity="0.9">
    02 DECEMBER 2026
  </text>

  <!-- Bottom Floral Ornament -->
  <g fill="url(#goldGrad)" transform="translate(200, 325) scale(0.6)">
    <path d="M0 0 C15 -10 25 -5 30 5 C15 5 5 -2 0 0 Z"/>
    <path d="M0 0 C-15 -10 -25 -5 -30 5 C-15 5 -5 -2 0 0 Z"/>
    <circle cx="0" cy="0" r="3.5"/>
  </g>
</svg>
